<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card card1">

            <div class="arrow">→</div>

            <h2>This is Card 1</h2>

            <p>
                This is a simple card with some information.
            </p>

            <button>Read More</button>

        </div>

        <div class="card card2">

            <div class="side">
                <span>→</span>
            </div>

            <h2>This is Card 2</h2>

            <p>
                This is another simple card with some information.
            </p>

            <button>Read More</button>

        </div>

    </div>

</body>
</html>
